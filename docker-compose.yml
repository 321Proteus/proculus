services:
  gateway:
    build:
      context: .
      target: gateway
    environment:
      PROCULUS_STORE_DIR: /data # saved runs go to the shared results volume
    volumes:
      - results:/data

  # Web UI over the saved runs, at http://localhost:8080 (login is on: the first visit asks for the
  # setup token, which is printed in the log of `api`: docker compose logs api):
  #   docker compose --profile ui up --build ui
  # `ui` serves the pages and passes /api/ requests on to `api` (the gateway),
  # which reads the saved runs. Only `ui` is published, and only on the loopback
  # interface: until there are user accounts it must not be reachable from other machines.
  api:
    build:
      context: .
      target: gateway
    command: ["serve", "--bind", "0.0.0.0", "--port", "8081", "--store", "/data", "--allow-host", "api"]
    volumes:
      - results:/data # writable: the accounts are kept in /data/accounts (without a database)
    profiles: ["ui"]

  ui:
    build:
      context: .
      target: ui
    command: ["--bind", "0.0.0.0", "--port", "8080", "--api", "http://api:8081"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    profiles: ["ui"]

  exporter:
    build:
      context: .
      target: exporter
    volumes:
      - results:/data:ro
    profiles: ["tools"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proculus
      POSTGRES_PASSWORD: proculus # development only: use a secret in any real deployment
      POSTGRES_DB: proculus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proculus -d proculus"]
      interval: 2s
      timeout: 3s
      retries: 30
    profiles: ["db", "test"]

  planner:
    build:
      context: .
      target: planner
    profiles: ["tools"]

  # Compares and follows saved runs:
  #   docker compose run --rm differ --store /data diff previous latest
  #   docker compose run --rm differ --store /data track
  differ:
    build:
      context: .
      target: differ
    volumes:
      - results:/data:ro
    profiles: ["tools"]

  # Looks at web services (title, headers, cookies, redirects, TLS certificate, favicon)
  # and detects technologies with the built-in signatures:
  #   docker compose run --rm http-prober --scope 10.0.0.0/24 --allowed-ports 80,443 http://10.0.0.5
  # With your own signatures (a directory of JSON files, mounted read-only):
  #   docker compose run --rm -v $PWD/my-signatures:/sigs:ro http-prober --signatures /sigs ...
  http-prober:
    build:
      context: .
      target: http-prober
    profiles: ["tools"]

  # Lists, checks and tests detection signatures:
  #   docker compose run --rm signatures list --category cms
  #   docker compose run --rm -v $PWD/my-signatures:/sigs:ro signatures lint /sigs
  signatures:
    build:
      context: .
      target: signatures
    profiles: ["tools"]

  scheduler:
    build:
      context: .
      target: scheduler
    profiles: ["tools"]

  # Real scans: discovery and services with nmap, optional web probing and signatures,
  # results saved as runs in the shared volume (read by the web UI, differ, exporter):
  #   docker compose run --rm runner --scope 10.0.0.0/24 --allowed-ports 22,80,443 --store /data --web 10.0.0.0/24
  #   docker compose run --rm runner --dry-run --scope 10.0.0.0/16 --allowed-ports 22,80,443 10.0.0.0/16
  # Scheduled, with a window and a frequency:
  #   docker compose run --rm runner --scope ... --allowed-ports ... --store /data --web \
  #       --window 22:00-06:00 --interval 24h --rounds 0 10.0.0.0/16
  # Raw-socket scans (SYN, ICMP ping: better host discovery) need root in the container:
  #   docker compose run --rm --user root runner --privileged ...
  # Only scan networks you are authorised to scan.
  runner:
    build:
      context: .
      target: runner
    volumes:
      - results:/data
    profiles: ["tools"]

  scan-worker:
    build:
      context: .
      target: scan-worker
    profiles: ["tools"]

  # Runs the whole test suite, including the database tests, against `postgres`:
  #   docker compose --profile test run --rm integration-test
  integration-test:
    build:
      context: .
      target: integration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROCULUS_TEST_DB_URL: postgresql://proculus:proculus@postgres:5432/proculus
    profiles: ["test"]

volumes:
  pgdata:
  results:
